name: Deploy to AWS S3

on:
  push:
    branches:
      - main  # change to your main branch if different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js (optional if you use React)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install and build (if applicable)
        run: |
          cd tp  # 👈 important: go into the right folder
          if [ -f package.json ]; then
            npm install
            npm run build
          fi

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: tp/build  # 👈 change to `tp` if it's just HTML/CSS/JS, or `tp/build` if it's React
